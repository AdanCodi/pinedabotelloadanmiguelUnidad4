x-app: &app
  build: .
  environment:
    DB_HOST: db
    DB_NAME: barberia_u4
    DB_USER: barberia_app
    DB_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}"
  volumes:
    - sesiones_php:/var/lib/barberia/sesiones
  depends_on:
    db:
      condition: service_healthy

services:
  app1:
    <<: *app

  app2:
    <<: *app

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: barberia_u4
      MYSQL_USER: barberia_app
      MYSQL_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env}"
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-citas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1 FROM citas LIMIT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  datos_mysql:
  sesiones_php: