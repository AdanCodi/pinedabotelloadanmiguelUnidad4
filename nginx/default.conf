upstream barberia {
    server app1:80;
    server app2:80;
}

server {
    listen 80;

    location / {
        proxy_pass http://barberia;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Instancia $upstream_addr always;
    }
}
